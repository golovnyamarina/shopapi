<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изменение цены продукта</title>
</head>
<body>
    <h1>Изменить цену для продукта №{{ product_id }}</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <label for="price">Новая цена:</label>
        <input type="number" id="price" name="price" step="0.01" required>
        
        <button type="submit">Сохранить</button>
    </form>
    
    <br>
    <a href="{% url 'products_list' %}">Отмена (Вернуться к списку)</a>
</body>
