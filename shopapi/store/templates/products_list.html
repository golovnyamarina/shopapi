<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары</title>
</head>
<body>
    <h1 style="color: mediumpurple;">Товары</h1>
<table class="table table-striped">
    <thead style="color: mediumpurple;">
        <tr>
            <th>Наименование</th>
            <th>Категория</th>
            <th>Цена</th>
            <th>Остаток</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for p in products %}
        <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.category }}</td>
            <td>{{ p.price }}</td>
            <td>{{ p.stock }}</td>
            <td><a href="{% url 'product_update_price' p.id %}">Изменить цену</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
