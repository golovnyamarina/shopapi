<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расчёт скидки клиента</title>
    <style>
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0069d9; }
        
        /* Стили для карточки с результатами */
        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e9ecef;
            border-left: 5px solid #28a745;
            max-width: 400px;
            border-radius: 4px;
        }
        .result-box h3 { margin-top: 0; color: #212529; }
        .result-item { margin-bottom: 8px; font-size: 16px; }
        .highlight { font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <h1>Расчёт скидки и итоговой суммы</h1>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="customer_id">ID клиента:</label>
            <input type="number" id="customer_id" name="customer_id" min="1" placeholder="Например: 5" required>
        </div>

        <div class="form-group">
            <label for="amount">Сумма заказа (руб.):</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0" placeholder="Например: 1500.00" required>
        </div>

        <button type="submit">Рассчитать</button>
    </form>

    {% if result %}
    <div class="result-box">
        <h3>Результаты расчёта:</h3>
        <div class="result-item">Клиент: <strong>№{{ result.customer_id }}</strong></div>
        <div class="result-item">Исходная сумма: <span>{{ result.amount }} руб.</span></div>
        <div class="result-item">Персональная скидка: <span class="highlight">{{ result.percent }}%</span></div>
        <hr>
        <div class="result-item"><strong>Итого к оплате: <span class="highlight">{{ result.total }} руб.</span></strong></div>
    </div>
    {% endif %}

    <br>
    <a href="javascript:history.back()">Назад</a>
</body>
</html>
